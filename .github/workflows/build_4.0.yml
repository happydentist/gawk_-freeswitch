name: build 4.0

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      gawk_version:
        description: "gawk version to build from ftp.gnu.org (e.g. 3.1.8). Defaults to the contents of GAWK_VERSION."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Resolve gawk version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.gawk_version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            if [ ! -f GAWK_VERSION ]; then
              echo "::error::GAWK_VERSION file not found in repository root"
              exit 1
            fi
            VERSION="$(tr -d ' \t\r\n' < GAWK_VERSION)"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No gawk version given (GAWK_VERSION file is empty)"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            # Guard against tagging a release whose GAWK_VERSION file was not updated
            PUSHED="${RELEASE_TAG#v}"
            case "$PUSHED" in
              "$VERSION"*) ;;
              *)
                echo "::error::Pushed tag '$RELEASE_TAG' does not match GAWK_VERSION file contents '$VERSION'. Update GAWK_VERSION in the tagged commit, or push a matching tag."
                exit 1
                ;;
            esac
          else
            RELEASE_TAG="v$VERSION"
          fi

          echo "Building gawk $VERSION (release tag: $RELEASE_TAG)"
          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Fetch gawk source from ftp.gnu.org
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o "gawk-$VERSION.tar.gz" \
            "https://ftp.gnu.org/gnu/gawk/gawk-$VERSION.tar.gz"
          tar xzf "gawk-$VERSION.tar.gz"

      - name: Build gawk.exe
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd "gawk-$VERSION"
          # The DOS/Windows port lives in pc/: copy its files (except its
          # ChangeLog) into the source root, per README_d/README.pc.
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          # MinGW has no <langinfo.h>; the old GnuWin32 builds got it from
          # LibGw32C. Use our minimal shim instead.
          cp ../shim/langinfo.h .

          # 判定目前是否為 4.0.0 版本
          if [ "$VERSION" = "4.0.0" ]; then
            echo "=== Detected version 4.0.0! Applying advanced modernization patches ==="

            # 1. 解決 strcoll 重複定義問題
            if [ -f "missing_d/strcoll.c" ]; then
              echo "" > missing_d/strcoll.c
            fi

            # 2. 修正 protos.h 中的 creat 宣告衝突
            if [ -f "protos.h" ]; then
              sed -i 's/mode_t/int/g' protos.h
            fi

            # 3. 暴力移除 awk.h 內過時的 vfprintf 阻礙檢查
            if [ -f "awk.h" ]; then
              sed -i '/you need a system with vfprintf/d' awk.h
            fi

            # 4. 全域基礎補丁清單
            BASE_PATCH='#include <stdio.h>\n#include <stdlib.h>\n#include <stdint.h>\n#include <limits.h>\n#include <fcntl.h>\n#include <stdbool.h>\n#include <ctype.h>\n#define HAVE_INTMAX_T 1\n#define HAVE_UINTMAX_T 1\n#define HAVE_LONG_LONG 1\n#define HAVE_UNSIGNED_LONG_LONG 1\n#define VERSION "4.0.0"\n#define PACKAGE "gawk"\n#define RETSIGTYPE void\n#define LOCALEDIR "."\n#define INT_DIV_MISSING_DIAG 1'

            # 5. 精準定向注入入口
            if [ -f "awk.h" ]; then
              sed -i "1i${BASE_PATCH}" awk.h
            fi
            if [ ! -f "config.h" ] && [ -f "pc/config.h" ]; then
              cp pc/config.h .
            fi
            touch config.h
            sed -i "1i${BASE_PATCH}\n#define is_blank isblank" config.h

            # 6. 解開 random.h 內部巨集的型態死結
            if [ -f "random.h" ]; then
              sed -i '1itypedef uint32_t gawk_uint32_t;' random.h
            fi

            # 7. 設定 4.0.0 專屬的全域編譯引導巨集
            MACRO_FLAGS="-DHAVE_STDARG_H=1 -DHAVE_VFPRINTF=1 -Dvfprintf=vfprintf -DHAVE_SNPRINTF=1 -Drestrict=__restrict"
            WARN_FLAGS="-Wno-error -Wno-stringop-overflow -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch"
            EXTRA_FLAGS="-O2 -I. -gdwarf-2 -g3 -std=gnu89 $MACRO_FLAGS $WARN_FLAGS"

          else
            echo "=== Detected legacy version $VERSION. Using original conservative build flags ==="
            # 完全維持原作者為 3.1.x 設定的標準安全引導參數
            EXTRA_FLAGS="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch"
          fi

          # 執行最終編譯
          make all \
            CC=gcc O=.o \
            CF="$EXTRA_FLAGS" \
            CFLAGS="$EXTRA_FLAGS" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3" LF2=-lmsvcp60 RSP=

      - name: Smoke test
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd "gawk-$VERSION"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          # Must be a native binary: only Windows system DLLs allowed.
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            echo "::error::gawk.exe depends on a non-native runtime DLL"
            exit 1
          fi

      - name: Package
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd "gawk-$VERSION"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=(dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt)

          {
            echo "GNU awk **$VERSION** for Windows (x86-64), built from [ftp.gnu.org/gnu/gawk/gawk-$VERSION.tar.gz](https://ftp.gnu.org/gnu/gawk/gawk-$VERSION.tar.gz) with MinGW-w64 GCC (\`make mingw32\` from the tarball's \`pc/\` port)."
            echo
            echo "Native win32 binaries — no Cygwin/MSYS layer. Runtime dependencies are Windows system DLLs only (\`kernel32.dll\`, \`msvcrt.dll\`, \`msvcp60.dll\`)."
            echo
            echo "- \`gawk.exe\` — GNU awk"
            echo "- \`pgawk.exe\` — profiling GNU awk"
            echo "- \`COPYING\` — license (GPL), from the source tarball"
            echo "- \`sha256sums.txt\`"
          } > notes.md

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing assets"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "gawk $VERSION for Windows" \
              --notes-file notes.md \
              "${ASSETS[@]}"
          fi
