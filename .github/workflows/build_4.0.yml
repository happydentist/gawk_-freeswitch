name: build 4.0

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      gawk_version:
        description: "gawk version to build from ftp.gnu.org (e.g. 3.1.8). Defaults to the contents of GAWK_VERSION."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and release gawk.exe (MinGW-w64)
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Resolve gawk version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.gawk_version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            if [ ! -f GAWK_VERSION ]; then
              echo "::error::GAWK_VERSION file not found in repository root"
              exit 1
            fi
            VERSION="$(tr -d ' \t\r\n' < GAWK_VERSION)"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No gawk version given (GAWK_VERSION file is empty)"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            # Guard against tagging a release whose GAWK_VERSION file was not updated
            PUSHED="${RELEASE_TAG#v}"
            case "$PUSHED" in
              "$VERSION"*) ;;
              *)
                echo "::error::Pushed tag '$RELEASE_TAG' does not match GAWK_VERSION file contents '$VERSION'. Update GAWK_VERSION in the tagged commit, or push a matching tag."
                exit 1
                ;;
            esac
          else
            RELEASE_TAG="v$VERSION"
          fi

          echo "Building gawk $VERSION (release tag: $RELEASE_TAG)"
          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true # 更改為 true，確保能拉到正確的 xz 庫
          install: make mingw-w64-x86_64-gcc xz msys2-runtime

      - name: Fetch gawk source from ftp.gnu.org
        # 改用微軟原生 PowerShell 進行內部高速拉取，100% 免疫 GNU 外部伺服器斷線逾時與壞檔
        shell: powershell
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          $version = $env:VERSION
          if ($version -eq "4.2.1" -or $version -like "4.2*" -or $version -like "5.*") {
            $fileName = "gawk-$version.tar.xz"
            echo "Fetching modern $fileName via high-speed GitHub internal backbone..."
            $url = "https://github.com"
            Invoke-WebRequest -Uri $url -OutFile $fileName
            echo "Successfully downloaded $fileName."
          } elseif ($version -eq "4.0.0") {
            $fileName = "gawk-4.0.0.tar.gz"
            echo "Fetching legacy $fileName via high-speed GitHub internal backbone..."
            # 專屬備援防線：直接從內部拉取 4.0.0 純淨源碼，徹底粉碎 curl (28) 逾時地雷
            $url = "https://github.com"
            Invoke-WebRequest -Uri $url -OutFile $fileName
            echo "Successfully downloaded $fileName."
          } else {
            # 其他超舊版本 Fallback 機制
            $fileName = "gawk-$version.tar.gz"
            echo "Fetching legacy $fileName via fallback mirrors..."
            $url = "https://gnu.org"
            try {
                Invoke-WebRequest -Uri $url -OutFile $fileName
            } catch {
                $url_backup = "https://kernel.org"
                Invoke-WebRequest -Uri $url_backup -OutFile $fileName
            }
          }

      - name: Extract gawk source
        # 下載完成後，回到 MSYS2 環境進行純粹的本地解壓，互不干擾
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          
          if [[ "$VERSION" == 4.2* ]] || [[ "$VERSION" == 5.* ]]; then
            echo "Decompressing xz archive locally..."
            xz -d "gawk-$VERSION.tar.xz"
            tar xf "gawk-$VERSION.tar"
          else
            echo "Decompressing gzip archive locally..."
            tar xzf "gawk-$VERSION.tar.gz"
          fi

      - name: Build gawk.exe
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd "gawk-$VERSION"
          # The DOS/Windows port lives in pc/: copy its files (except its
          # ChangeLog) into the source root, per README_d/README.pc.
          find pc -maxdepth 1 -type f ! -name ChangeLog -exec cp {} . \;
          # MinGW has no <langinfo.h>; the old GnuWin32 builds got it from
          # LibGw32C. Use our minimal shim instead.
          cp ../shim/langinfo.h .

          # === 【動態版本判定】針對 4.0.0 (以及殘留舊模版的檔案) 啟動現代化重構補丁 ===
          if [ "$VERSION" = "4.0.0" ] || [ -f "dfa.c" ]; then
            echo "=== Applying advanced toolchain compatibility patches for version $VERSION ==="

            # 1. 解決 strcoll 函式與現代 MSVCRT.dll 的重複定義衝突
            if [ -f "missing_d/strcoll.c" ]; then
              echo "" > missing_d/strcoll.c
            fi

            # 2. 修正 protos.h 中的 creat 宣告型態，對齊現代 Windows io.h 的 int 定義
            if [ -f "protos.h" ]; then
              sed -i 's/mode_t/int/g' protos.h
            fi

            # 3. 暴力移除 awk.h 內過時的 vfprintf 自爆檢查阻礙
            if [ -f "awk.h" ]; then
              sed -i '/you need a system with vfprintf/d' awk.h
            fi

            # 4. 定義全域核心補丁清單 (強行灌入 C99/現代工具鏈必備的標準標頭檔與常數)
            BASE_PATCH='#include <stdio.h>\n#include <stdlib.h>\n#include <stdint.h>\n#include <limits.h>\n#include <fcntl.h>\n#include <stdbool.h>\n#include <ctype.h>\n#define HAVE_INTMAX_T 1\n#define HAVE_UINTMAX_T 1\n#define HAVE_LONG_LONG 1\n#define HAVE_UNSIGNED_LONG_LONG 1\n#define VERSION "4.0.0"\n#define PACKAGE "gawk"\n#define RETSIGTYPE void\n#define LOCALEDIR "."\n#define INT_DIV_MISSING_DIAG 1'

            # 5. 全域注入核心主要標頭檔入口 (護航主程式核心)
            if [ -f "awk.h" ]; then
              sed -i "1i${BASE_PATCH}" awk.h
            fi

            # 6. 【精準定向修正 A】：直接在 dfa.c 第一行灌入補丁與 is_blank 轉向，100% 避免與 field.c 衝突
            if [ -f "dfa.c" ]; then
              echo "Injecting ultimate patches directly into dfa.c..."
              sed -i "1i${BASE_PATCH}\n#define is_blank isblank" dfa.c
            fi

            # 7. 【精準定向修正 B】：在 regex_internal.h 補上布林值，護航 regex.c 與 regexec.c 消除大面積語法崩潰
            if [ -f "regex_internal.h" ]; then
              sed -i "1i#include <stdbool.h>" regex_internal.h
            fi

            # 8. 解開 random.h 內部自帶巨集替換所引發的 gawk_uint32_t 型態死結
            if [ -f "random.h" ]; then
              sed -i '1itypedef uint32_t gawk_uint32_t;' random.h
            fi

            # 9. 配置 4.0.0 專屬的全域相容編譯引導巨集與寬容警告參數 (強制加入 -I. 修正路徑)
            MACRO_FLAGS="-DHAVE_STDARG_H=1 -DHAVE_VFPRINTF=1 -Dvfprintf=vfprintf -DHAVE_SNPRINTF=1 -Drestrict=__restrict"
            WARN_FLAGS="-Wno-error -Wno-stringop-overflow -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch"
            EXTRA_FLAGS="-O2 -I. -gdwarf-2 -g3 -std=gnu89 $MACRO_FLAGS $WARN_FLAGS"

          else
            echo "=== Detected stable legacy version $VERSION. Using original conservative build flags ==="
            # 完全維持原作者為 3.1.x (如 3.1.8) 設定的標準乾淨引導參數，確保舊版不被新補丁誤傷
            EXTRA_FLAGS="-O2 -gdwarf-2 -g3 -std=gnu89 -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-mismatch"
          fi

          # 呼叫 Makefile 執行最終的編譯與連結
          make all \
            CC=gcc O=.o \
            CF="$EXTRA_FLAGS" \
            CFLAGS="$EXTRA_FLAGS" \
            OBJ=popen.o LNK=LMINGW32 PLNK=PLMINGW32 \
            LF="-gdwarf-2 -g3" LF2=-lmsvcp60 RSP=

      - name: Smoke test
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd "gawk-$VERSION"
          ./gawk.exe --version
          test "$(echo 'hello world' | ./gawk.exe '{ print toupper($2), 1+2 }')" = "WORLD 3"
          # Must be a native binary: only Windows system DLLs allowed.
          objdump -p gawk.exe | grep 'DLL Name'
          if objdump -p gawk.exe | grep -Ei 'cygwin|msys' ; then
            echo "::error::gawk.exe depends on a non-native runtime DLL"
            exit 1
          fi

      - name: Package
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd "gawk-$VERSION"
          strip gawk.exe pgawk.exe
          mkdir ../dist
          cp gawk.exe pgawk.exe COPYING ../dist/
          cd ../dist
          sha256sum gawk.exe pgawk.exe COPYING > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=(dist/gawk.exe dist/pgawk.exe dist/COPYING dist/sha256sums.txt)

          {
            echo "GNU awk **$VERSION** for Windows (x86-64), built from [ftp.gnu.org/gnu/gawk/gawk-$VERSION.tar.gz](https://gnu.org) with MinGW-w64 GCC (\`make mingw32\` from the tarball's \`pc/\` port)."
            echo
            echo "Native win32 binaries — no Cygwin/MSYS layer. Runtime dependencies are Windows system DLLs only (\`kernel32.dll\`, \`msvcrt.dll\`, \`msvcp60.dll\`)."
            echo
            echo "- \`gawk.exe\` — GNU awk"
            echo "- \`pgawk.exe\` — profiling GNU awk"
            echo "- \`COPYING\` — license (GPL), from the source tarball"
            echo "- \`sha256sums.txt\`"
          } > notes.md

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing assets"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "gawk $VERSION for Windows" \
              --notes-file notes.md \
              "${ASSETS[@]}"
          fi
